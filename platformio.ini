[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DPIO_FRAMEWORK_ESP_IDF_ENABLE_TINYUSB
  -DCONFIG_TINYUSB_MIDI_ENABLED=1
  -Wall
  -Wextra
  -Wno-unused-parameter
board_build.esp-idf.advanced_options =
  CONFIG_IDF_COMPONENT_MANAGER=n
build_unflags =
  -DIDF_COMPONENT_MANAGER
extra_scripts =
  pre:disable_component_manager.py

[env:esp32s3_keypadtest]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DO3CHORDS_KEYPAD_TEST
